# Case: the kubeflow/pipelines frontend (a real open-source repo, M6), scored against
# its merged MUI v4 -> v5 PR. Cloned into the Migrator's cache on the first run; see
# evals/m6-cases/opossum-ui/case.toml and docs/m6-plan.md.

id = "kubeflow-pipelines"
migration = "mui@4->mui@5"
split = "dev"
runner = "vitest"
reference = "upstream"
ceiling_s = 5400

[upstream]
repo = "https://github.com/kubeflow/pipelines.git"
commit = "72fdd6badecd36063855f6fd328e9c02cc78b1bb"         # the squash merge's parent on master
subdir = "frontend"
reference_pr = "https://github.com/kubeflow/pipelines/pull/12925"
reference_head = "c3f9f67c2b4d9c682907aabd332ca268b5be350b"  # the squash merge (2026-03-02)

[repo]
# TypeScript 4.9, React 17, Vite 7, Vitest 4, npm (lockfile v3); .nvmrc says 22.19.
node = "22"
install_flags = []
source_globs = ["src/**/*.ts", "src/**/*.tsx"]
exclude = ["**/node_modules/**", "src/apis/**", "src/apisv2beta1/**", "src/generated/**", "src/third_party/**"]
coverage = true
update_snapshots = true

[repo.verify]
# The repo's own typecheck and lint scripts, called as binaries; the tests as its `test`
# script does, after its `pretest` (the Tailwind build the tests import).
typecheck = "node_modules/.bin/tsc --noEmit"
lint = "node_modules/.bin/eslint --ext js,ts,tsx src --max-warnings=0"
test = "node_modules/.bin/tailwindcss build -i src/tailwind.css -o src/build/tailwind.output.css && LC_ALL=en_US.UTF-8 node_modules/.bin/vitest run"

# The visual check (M7). The repo's Vite build (without its lint and type-check, which
# Verify already runs), served with the repo's own mock API server. That mock only
# serves the v1beta1 API while this frontend calls v2beta1, so the list pages render
# their error banner and empty tables: the same in every capture, and the MUI parts
# (navigation, buttons, filter field, table header, pagination) are all there.
# --transpile-only: the mock server doesn't pass its own type-check under ts-node-dev.
[repo.visual]
build = "node_modules/.bin/tailwindcss build -i src/tailwind.css -o src/build/tailwind.output.css && node_modules/.bin/vite build"
out = "build"

[repo.visual.backend]
command = "node_modules/.bin/ts-node-dev --transpile-only -O '{\"module\": \"commonjs\"}' --project mock-backend/tsconfig.json -r tsconfig-paths/register mock-backend/mock-api-server.ts 3001"
port = 3001
proxy = ["/api", "/apis", "/apps", "/artifacts", "/hub", "/k8s", "/ml_metadata", "/system", "/visualizations"]

[[repo.visual.pages]]
name = "pipelines"
path = "/#/pipelines"
files = ["src/pages/PipelineList.tsx", "src/components/SideNav.tsx", "src/components/CustomTable.tsx", "src/components/Toolbar.tsx"]

[[repo.visual.pages]]
name = "experiments"
path = "/#/experiments"
files = ["src/pages/ExperimentList.tsx", "src/components/CustomTable.tsx"]

[[repo.visual.pages]]
name = "runs"
path = "/#/runs"
files = ["src/pages/RunList.tsx", "src/components/CustomTable.tsx"]

[[repo.visual.pages]]
name = "recurringruns"
path = "/#/recurringruns"
files = ["src/pages/RecurringRunList.tsx", "src/components/CustomTable.tsx"]
