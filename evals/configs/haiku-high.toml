# M5 model comparison: Haiku 5.5 at high effort on every attempt. Same knobs as
# haiku-debug, but a reported experiment (haiku-debug ran on fixture revision 1).
schema_version = 1
name = "haiku-high"
description = "Rules, then the repair agent on Claude Haiku 5.5 at high effort, up to 3 attempts per failing file."

[repair]
enabled = true
attempt_models = ["claude-haiku-5-5", "claude-haiku-5-5", "claude-haiku-5-5"]
effort = "high"
prompt_version = "v1"
retrieval = "keyword"
max_attempts = 3

[cost]
max_run_usd = 5.0
max_month_usd = 20.0

[rules]
skip = []
