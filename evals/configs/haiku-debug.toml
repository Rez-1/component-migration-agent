# Haiku 5.5 for debugging the real repair loop cheaply (ticket #12). Not for reported
# numbers.
schema_version = 1
name = "haiku-debug"
description = "Debugging only: the repair agent on Claude Haiku 5.5, up to 3 attempts per failing file."

[repair]
enabled = true
attempt_models = ["claude-haiku-5-5", "claude-haiku-5-5", "claude-haiku-5-5"]
effort = "high"
prompt_version = "v1"
retrieval = "keyword"
max_attempts = 3

[cost]
max_run_usd = 1.0
max_month_usd = 20.0

[rules]
skip = []
