# M6 Baseline: rules only, as `baseline`, with M6's caps (docs/m6-plan.md). A new file
# because the caps are part of a configuration's digest: editing baseline.toml would
# detach the M2–M5 results from it.
schema_version = 1
name = "m6-baseline"
description = "Rules only: the dependency map and the official codemods, no repair agent (M6 caps)."

[repair]
enabled = false

[cost]
max_run_usd = 8.0
max_month_usd = 50.0
