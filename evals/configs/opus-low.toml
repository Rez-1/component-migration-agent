# Opus 5.5 at low effort: the configuration for measured runs (ticket #12).
# Needs the repair loop (M3): `migrator eval run --config opus-low` refuses to start
# in M2 rather than quietly running the Baseline.
schema_version = 1
name = "opus-low"
description = "Rules, then the repair agent on Claude Opus 5.5 at low effort, up to 3 attempts per failing file."

[repair]
enabled = true
attempt_models = ["claude-opus-5-5", "claude-opus-5-5", "claude-opus-5-5"]
effort = "low"
prompt_version = "v1"
retrieval = "keyword"
max_attempts = 3

[cost]
max_run_usd = 5.0
max_month_usd = 20.0

[rules]
skip = []
