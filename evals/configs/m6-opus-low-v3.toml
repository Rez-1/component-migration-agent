# M6, after the OpossumUI reruns: m6-opus-low-v2 plus test-fitting hand-offs, the
# owner's decision on 10 November (no reviewer model). A passing patch that the free
# test-fitting flag fires on (accessibility props or the rendered element changed, for
# a file that failed a test) becomes a hand-off, its patch set aside. A new file, so
# m6-opus-low-v2's results stay attached to its digest.
schema_version = 1
name = "m6-opus-low-v3"
description = "m6-opus-low-v2 plus test-fitting hand-offs: a flagged passing patch goes to a human."

[repair]
enabled = true
attempt_models = ["claude-opus-5-5", "claude-opus-5-5", "claude-opus-5-5"]
effort = "low"
prompt_version = "v3"
retrieval = "keyword"
max_attempts = 3
shared_causes = true
test_fitting_hand_off = true

[cost]
max_run_usd = 8.0
max_month_usd = 50.0
reserve_attempt_usd = 0.15
