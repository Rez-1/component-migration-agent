# Planted traps in fixtures/angular15-app: one instance of one breaking change each.
# Same schema as evals/cases/fixture-mui4/traps.yaml; `caught_by` adds "leftovers" (M7: a
# failure with source migration in the trap's file). The guide is
# guides/v15-mdc-migration.md at angular/components 15.2.9 (vendored in
# src/migrator/migrations/angular-material-legacy-to-mdc/guide/); its changes are
# bullets under "### <Component>", so `section` is "<Component> › <the bullet's gist>".
# The guide has no "handled by the schematic" marker, so `codemod_marked` is always false.
#
# Baseline (11 November 2026, the Migrator itself, Docker, Node 18.20.8, Angular CLI
# 15.2.11, Material 15.2.9): Pre-check ok (ng build, ng lint, 30 Karma specs pass). The
# mdc-migration schematic, run once, updated 25 files and left 5 notes; eslint --fix
# formatted 22. Then: ng build 5 errors (the 5 build traps below), so Karma ran no spec
# (the test bundle didn't compile), lint clean, and 8 leftovers: the schematic's 5 notes
# (4 TODO(mdc-migration) in stylesheets, 1 slider TODO in a template) and the 3 rules
# under the notes that still name a legacy internal class. (The first preview also
# counted 2 mixin names inside an ng update comment; comments no longer count.)
#
# With the build fixed (agent-fixes.yaml without the two template traps), Karma runs:
# slider-form-control fails 3 specs (NG01203 no value accessor), placeholder-as-label 1
# spec, confirm-button-wrapper-class (human) 2 specs. With every fix in agent-fixes.yaml
# plus human-fix.yaml: 0 failures, 30 of 30 specs, lint clean, no leftovers, no stale
# rules (the oracle).
#
# Revision 2 (11 November, the owner's decision that the agent resolves the schematic's
# notes): the four stylesheet rules it marks with TODO(mdc-migration) became agent traps
# (revision 1 had them as visual-only). One of them is a false alarm the agent must
# recognise: a rule on <mat-radio-button> itself, which MDC keeps.
#
# Revision 3 (11 November, owner's OK): confirm-button-wrapper-class is located on
# confirm-button.component.ts, the file its failing specs are charged to and the file
# its note expects handed off (revision 2 had the spec, which nothing hands off). The
# spec line is kept in `symbol`'s note below.

schema_version: 1
revision: 3
case: fixture-angular15
counts: { rules: 9, agent: 11, human: 1, visual-only: 0 }

traps:
  # ---------------------------------------------------------------- rules (9)
  - id: legacy-entry-points
    title: Every NgModule import moves from @angular/material/legacy-* to the MDC entry point
    breaking_change: { file: v15-mdc-migration.md, section: "How to Migrate › 2. Run the migration tool", codemod_marked: false }
    expected_layer: rules
    location: { file: src/app/shared/material.module.ts, line: 2, symbol: MatLegacyButtonModule }
    caught_by: none
    baseline_check: rewritten (all 16 entry points in material.module.ts)

  - id: legacy-symbols-in-components
    title: Legacy classes used in components (MatLegacyDialog, MatLegacySelect, MatLegacyPaginator, MatLegacyTableDataSource) are renamed
    breaking_change: { file: v15-mdc-migration.md, section: "How to Migrate › 2. Run the migration tool", codemod_marked: false }
    expected_layer: rules
    location: { file: src/app/app.component.ts, line: 2, symbol: MatLegacyDialog }
    caught_by: none
    baseline_check: rewritten in 5 component files

  - id: legacy-theme-mixins
