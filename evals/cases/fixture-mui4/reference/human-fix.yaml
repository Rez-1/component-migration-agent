# The known-good fix for the human trap (faq-snapshot-markup), fixture revision 2.
#
# Faq's test records the markup of a question header in a Jest snapshot. v5's
# Accordion (the codemod renames ExpansionPanel) renders different markup: new class
# names, emotion classes, and the expand icon without its IconButton wrapper. No source
# change can make v5 render the v4 markup, and the snapshot is a Test file the repair
# agent may not edit, so the agent's expected result is a hand-off and this is the
# human's answer at Review (Edit): re-record the snapshot after checking the new markup.
# This is the snapshot as jest -u writes it on v5.18.0 with the reference fixes applied.
#
# Used by tests/test_oracle_slow.py: a scripted reviewer applies it at the hand-off.
#
# Revision 1's human trap (styles-needs-theme-provider) is an agent trap from revision 2;
# its old human fix, giving renderComponent the theme in src/test-utils.tsx, is still a
# valid fix and scores Other layer.
