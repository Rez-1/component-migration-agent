      section: "@mui/material/styles › ✅ Rename createMuiTheme"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/theme.ts, line: 4, symbol: createMuiTheme }
    caught_by: none
    note: >-
      preset-safe also wraps the argument in adaptV4Theme(...) (Theme structure ›
      ✅ Add adaptV4Theme helper), which moves `props` and `overrides` to
      `components` at runtime. The repair notes say to keep adaptV4Theme.
    baseline_check: handled (createTheme(adaptV4Theme({...})))

