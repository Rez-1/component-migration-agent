# Planted traps in fixtures/mui4-app: one instance of one breaking change each.
# Read by the eval runner to score trap results (Expected / Other layer / Missed).
#
# Fields
#   id               stable key, used in scorecards and experiment summaries
#   title            short human label
#   breaking_change  where the guide describes it: guide file (v5.18.0,
#                    docs/data/material/migration/migration-v4/) and
#                    "## section › ### change" heading. `codemod_marked` is true
#                    when the heading carries the guide's ✅ "handled by a codemod" marker.
#   expected_layer   rules | agent | human | visual-only
#                    (rules/agent/human are the glossary's Layers; visual-only
#                    means the trap is never caught by verify and is scored
#                    "Not scored")
#   location         primary file, line in the v4 source, and the symbol
#   caught_by        what makes verify fail if the trap is left unfixed after the
#                    Baseline: typecheck, lint, or a test as "<file> › <name>".
#                    "none" for rules traps (the codemods fix them) and the visual trap.
#   note             anything a reader of the scorecard needs
#   baseline_check   what happened in the empirical preview of the Baseline (below)
#
# Baseline preview, 2026-11-09 (not M1's Baseline, a hand-run preview of it):
#   copy of the fixture -> npm ci (v4) -> @mui/codemod 9.4.0 v5.0.0/{preset-safe,
#   variant-prop, link-underline-hover, box-sx-prop} on src/, each once ->
#   dependency bump (@mui/material, @mui/icons-material, @mui/styles 5.18.0,
#   @mui/lab 5.0.0-alpha.177, @emotion/react 11.14.0, @emotion/styled 11.14.1)
#   -> npm install -> npm run typecheck / lint / jest. Node 24.14.0, npm 11.9.0.
#   Result: 12 files changed by the codemods (0 ERR); typecheck 8 errors in
#   6 files; lint clean; jest 7 of 19 tests failing in 5 suites. 9 source files
#   fail, 3 affected files are clean (App.tsx, UsersTable.tsx, Faq.tsx).
#   Every rules trap was rewritten as expected; every agent and human trap fails
#   verify. In a second scratch copy, applying a minimal hand-written fix for each
#   agent trap and then the human fix (in src/test-utils.tsx) made verify pass,
#   so every trap is fixable and its check goes green once fixed.

schema_version: 1
case: fixture-mui4
counts: { rules: 12, agent: 8, human: 1, visual-only: 1 }

traps:
