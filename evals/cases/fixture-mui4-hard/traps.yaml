# Planted traps in fixtures/mui4-app-hard: one instance of one breaking change each.
# Same schema as evals/cases/fixture-mui4/traps.yaml (see its header for the fields).
#
# Why this case exists: on fixture-mui4, Opus 5.5 at low effort already fixes all 9
# agent traps, so quality there is saturated. This fixture's agent traps are built to
# be harder while staying fair (each has a clean, minimal fix: reference/agent-fixes.yaml):
#   - the failing screen is not where the fix goes: five of the nine fixes are in a
#     shared module the failing screen imports (theme, a picker, shared props, a
#     helper, a custom input), and two more in shared wrappers that fail on their own;
#   - five are caught only by a behaviour test: type-check and lint pass, the code
#     compiles, and only what the user sees is wrong;
#   - three hide from a codemod the guide marks ✅ (a spread, a withStyles wrapper),
#     and one is broken *by* a codemod (RootRef becomes a fragment, dropping the ref);
#   - two screens fail for two unrelated reasons each, in two different imported files.
# JSS stays on @mui/styles (the MVP decision): no fix needs styled() or sx.
#
# Baseline preview, 2026-11-09: `migrator migrate fixtures/mui4-app-hard --from mui@4
# --to mui@5 --dry-run --case evals/cases/fixture-mui4-hard/case.toml --sandbox local`
# (Node 24.14.0, npm 11.9.0, @mui/codemod 9.4.0, MUI 5.18.0). Result: 14 files changed
# by the rules; 13 failures in 7 files (typecheck 4, lint 1, 8 of 16 tests failing in
# 5 suites). Every rules trap rewritten as expected, every agent trap Missed. In a copy
# of that workspace, applying reference/agent-fixes.yaml made verify pass, and leaving
# out any one fixed file's edits brings back exactly that trap's checks.

schema_version: 1
revision: 1
case: fixture-mui4-hard
counts: { rules: 6, agent: 9, human: 0, visual-only: 0 }

traps:
  # ---------------------------------------------------------------- rules (6)
  - id: create-theme
    title: createMuiTheme renamed createTheme
    breaking_change:
      file: v5-style-changes.md
      section: "@mui/material/styles › ✅ Rename createMuiTheme"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/theme.ts, line: 10, symbol: createMuiTheme }
    caught_by: none
    note: preset-safe also wraps the argument in adaptV4Theme(...), which turns `overrides` into `components.*.styleOverrides` (see theme-state-selector).
    baseline_check: handled (createTheme(adaptV4Theme({...})))

  - id: pagination-import
    title: Pagination (and ToggleButtonGroup) moved from lab to core
    breaking_change:
      file: v5-component-changes.md
      section: "Pagination › ✅ Update import"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/screens/Reports.tsx, line: 3, symbol: "import { Pagination, ToggleButton, ToggleButtonGroup } from '@material-ui/lab'" }
    caught_by: none
    note: The same import line carries ToggleButton › ✅ Update import; moved-lab-modules handles both.
    baseline_check: handled

  - id: pagination-round
    title: Pagination shape "round" renamed "circular"
    breaking_change:
      file: v5-component-changes.md
      section: "Pagination › ✅ Rename round to circular"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/screens/Reports.tsx, line: 82, symbol: 'Pagination shape="round"' }
    caught_by: none
    baseline_check: handled

  - id: skeleton-rect
    title: Skeleton moved from lab, variant "rect" renamed "rectangular"
    breaking_change:
      file: v5-component-changes.md
      section: "Skeleton › ✅ Rename circle and rect"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/screens/IssueList.tsx, line: 58, symbol: 'Skeleton variant="rect"' }
    caught_by: none
    note: The default import from '@material-ui/lab/Skeleton' (line 13) is moved too (Skeleton › ✅ Update import).
    baseline_check: handled

  - id: dialog-transition-literal
    title: Dialog onEntered moved into TransitionProps (literal prop)
    breaking_change:
      file: v5-component-changes.md
      section: "Dialog › ✅ Update transition props"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/screens/NewIssueDialog.tsx, line: 54, symbol: "onEntered={() => titleRef.current?.focus()}" }
    caught_by: none
    note: >-
      The control for dialog-transition-spread: the same breaking change written as a
      JSX attribute, which use-transitionprops rewrites. NewIssueDialog's title-focus
      test passes after the Baseline.
    baseline_check: handled (TransitionProps={{ onEntered }})

  - id: autocomplete-option-equal-literal
    title: getOptionSelected renamed isOptionEqualToValue (literal prop)
    breaking_change:
      file: v5-component-changes.md
      section: "Autocomplete › ✅ Rename getOptionSelected"
      codemod_marked: true
    expected_layer: rules
    location: { file: src/components/LabelPicker.tsx, line: 24, symbol: getOptionSelected }
    caught_by: none
    note: The control for option-equal-spread. The codemod also moves the lab import (line 2).
    baseline_check: handled

  # ---------------------------------------------------------------- agent (9)
  - id: theme-state-selector
    title: "Theme override uses the JSS state reference &$selected, dead under Emotion"
    breaking_change:
      file: v5-style-changes.md
      section: "Migrate theme styleOverrides to Emotion › Replace state class names"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/theme.ts, line: 23, symbol: "overrides.MuiTab.root['&$selected']" }
    caught_by:
      - "src/screens/__tests__/Board.test.tsx › shows the selected status tab in bold"
    note: >-
      adaptV4Theme moves `overrides` to styleOverrides, which v5 renders with Emotion;
      Emotion has no `$rule` references, so the selector silently matches nothing. No
      type error, no crash; only the computed font-weight of the selected tab changes.
      The failure is charged to Board.tsx; the fix is in src/theme.ts, which Board
      imports (statusColors), so it is in reach. theme.ts itself has no failure and is
      never queued. Fix: '&.Mui-selected'.
    baseline_check: fails (1 failing test; no type error)

  - id: autocomplete-reason-names
    title: Autocomplete onChange reasons renamed (select-option -> selectOption)
    breaking_change:
      file: v5-component-changes.md
      section: "Autocomplete › Rename reason arguments"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/components/LabelPicker.tsx, line: 7, symbol: "ANNOUNCEMENTS['select-option' | 'remove-option']" }
    caught_by:
      - "src/screens/__tests__/IssueDetail.test.tsx › adds a label and says so"
      - "src/screens/__tests__/IssueDetail.test.tsx › removes a label with Backspace, and Undo brings it back"
    note: >-
      The reasons key a Record<string, ...> lookup, so TypeScript can't see the old
      names: the labels still change, only the announcement (and Undo) disappear.
      Charged to IssueDetail.tsx, fixed in the LabelPicker it imports. A fix in
      IssueDetail instead (it can't see the reason) would be a rewrite and score
      Other layer.
    baseline_check: fails (2 failing tests)

  - id: dialog-transition-spread
    title: Dialog onEntered passed through a helper's spread, which the codemod can't see
    breaking_change:
      file: v5-component-changes.md
      section: "Dialog › ✅ Update transition props"
      codemod_marked: true
    expected_layer: agent
    location: { file: src/components/dialogFocus.ts, line: 7, symbol: "focusOnOpen() returns { onEntered }" }
    caught_by:
      - "src/screens/__tests__/IssueDetail.test.tsx › puts the cursor in the comment box once the dialog is open"
    note: >-
      `<Dialog {...focusOnOpen(commentRef)}>`: JSX spreads get no excess-property
      check, so onEntered type-checks, reaches the DOM as an unknown prop and never
      fires. The guide marks the change ✅ and the literal case is handled
      (dialog-transition-literal); the spread is not. Fix in the helper: return
      { TransitionProps: { onEntered } }. Fixing it in IssueDetail.tsx (passing
      TransitionProps there) also works and scores Other layer.
    baseline_check: fails (1 failing test; no type error)

  - id: option-equal-spread
    title: getOptionSelected in a shared props object, which the codemod can't see
    breaking_change:
      file: v5-component-changes.md
      section: "Autocomplete › ✅ Rename getOptionSelected"
      codemod_marked: true
    expected_layer: agent
    location: { file: src/components/personPicker.ts, line: 6, symbol: personPickerProps.getOptionSelected }
    caught_by:
      - "src/screens/__tests__/NewIssueDialog.test.tsx › assigns new issues to the signed-in user, marked in the list"
    note: >-
      Spread into two Autocompletes. v5 ignores the old key and compares options by
      identity; the signed-in user is a different object from the team list's, so the
      current assignee is no longer marked selected (and MUI warns the value is
      invalid). No type error. Fix: rename the key in personPicker.ts.
    baseline_check: fails (1 failing test; no type error)

  - id: input-component-ref
    title: Custom inputComponent must forward ref; inputRef is no longer passed
    breaking_change:
      file: v5-component-changes.md
      section: "TextField › Forward ref instead of inputRef prop"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/components/DurationInput.tsx, line: 22, symbol: "DurationInput reads props.inputRef" }
    caught_by:
      - "src/screens/__tests__/NewIssueDialog.test.tsx › creates the issue with a tidied estimate"
    note: >-
      InputBaseComponentProps has an index signature, so reading inputRef still
      type-checks; in v5 it is undefined, the input's ref is never set, and the
      uncontrolled estimate is read back as ''. Fix: forwardRef in DurationInput.tsx,
      wrapping the existing function. A first oracle that rewrote the component as an
      inline forwardRef(function ...) re-indented it past 40% of this 40-line file and
      was refused by the patch-size limit (a hand-off): a real cost of a correct fix.
      Shares NewIssueDialog.tsx's repair with option-equal-spread: one screen, two
      unrelated causes in two imported files.
    baseline_check: fails (1 failing test; no type error)

  - id: root-ref-removed
    title: RootRef removed; the codemod's fragment drops the ref
    breaking_change:
      file: v5-component-changes.md
      section: "RootRef › Remove component"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/screens/Activity.tsx, line: 64, symbol: "<RootRef rootRef={listRef}>" }
    caught_by:
      - typecheck   # TS2305 RootRef is not exported (the multi-line import escapes the codemod's regex)
      - lint        # RootRef unused
      - "src/screens/__tests__/Activity.test.tsx › adds an update and moves focus to it"
    note: >-
      preset-safe's root-ref turns <RootRef> into <>, so listRef is never attached
      and focus no longer moves to the new entry. Deleting the dead import clears
      type-check and lint but not the test. Fix: ref={listRef} on the List, and type
      the ref HTMLUListElement (v5 refs are typed per element: "ref › Fix ref type
      specificity"), all in Activity.tsx.
    baseline_check: fails (1 type error, 1 lint error, 1 failing test)

  - id: slider-event-type
    title: Slider onChange event is a native Event (shared wrapper's prop type)
    breaking_change:
      file: v5-component-changes.md
      section: "Slider › Update event type (TypeScript)"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/components/RangeSlider.tsx, line: 10, symbol: "RangeSliderProps.onChange" }
    caught_by:
      - typecheck   # TS2769 on line 27 (onChange={onChange})
    note: >-
      The wrapper is a failing file of its own and is repaired before Reports.tsx,
      which imports it. Fix the public prop type in the wrapper; Reports passes an
      unannotated arrow function, so it keeps compiling.
    baseline_check: fails (1 type error)

  - id: table-pagination-labels
    title: TablePagination back/nextIconButtonText removed; use getItemAriaLabel
    breaking_change:
      file: v5-component-changes.md
      section: "TablePagination › Customize labels with getItemAriaLabel prop"
      codemod_marked: false
    expected_layer: agent
    location: { file: src/screens/IssueList.tsx, line: 85, symbol: "backIconButtonText / nextIconButtonText" }
    caught_by:
      - typecheck   # TS2769 unknown props
      - "src/screens/__tests__/IssueList.test.tsx › pages through the issues five at a time"
    note: >-
      Deleting the two props clears the type error but the buttons fall back to
      "Go to next page", so the test, which finds them by name, still fails.
    baseline_check: fails (1 type error, 1 failing test)

  - id: chip-variant-wrapped
    title: Chip variant "default" renamed "filled", behind a withStyles wrapper
    breaking_change:
      file: v5-component-changes.md
      section: "Chip › ✅ Rename default to filled"
      codemod_marked: true
    expected_layer: agent
    location: { file: src/components/StatusChip.tsx, line: 19, symbol: 'SmallChip variant="default"' }
    caught_by:
      - typecheck   # TS2322 '"default"' not assignable
    note: >-
      chip-variant-prop matches <Chip> by name; the element here is SmallChip =
      withStyles(...)(Chip), so the codemod skips it. The easy one of the set.
    baseline_check: fails (1 type error)
