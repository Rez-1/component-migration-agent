[project]
name = "component-migration-agent"
version = "0.1.0"
description = "The Migrator: moves a React codebase from one component-library version to the next (MUI v4 -> v5 first), rules first, measured against a rules-only Baseline."
authors = [{ name = "Rezvan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120,<2",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langchain-core==1.7.6",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langsmith>=0.14,<1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tree-sitter==0.26.0",
    "tree-sitter-typescript==0.23.2",
    "typer>=0.28.0",
]

[project.scripts]
migrator = "migrator.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "migrator"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that need Node, npm and network (run with -m slow)",
    "docker: runs in the Docker sandbox; need a running Docker and network (run with -m docker)",
]
addopts = "-m 'not slow and not docker'"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["runs", "fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
# The glossary's test names use "›" (as traps.yaml does) on purpose.
ignore = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter_typescript"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
