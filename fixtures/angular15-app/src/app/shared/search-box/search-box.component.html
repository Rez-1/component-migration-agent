<mat-form-field class="search-box">
  <mat-icon matPrefix>search</mat-icon>
  <input matInput type="search" [placeholder]="placeholder" [formControl]="control" />
  <button
    *ngIf="control.value"
    mat-icon-button
    matSuffix
    type="button"
    aria-label="Clear search"
    (click)="clear()"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
