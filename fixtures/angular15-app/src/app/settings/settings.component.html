<section class="page">
  <h1 class="page-title mat-headline">Settings</h1>

  <form class="settings" [formGroup]="form" (ngSubmit)="save()">
    <mat-checkbox formControlName="emailOnNew">Email me about new issues</mat-checkbox>
    <mat-slide-toggle formControlName="compactTable">Compact issue table</mat-slide-toggle>

    <div class="group">
      <span class="group-label" id="default-view-label">Open the app on</span>
      <mat-radio-group formControlName="defaultView" aria-labelledby="default-view-label">
        <mat-radio-button value="issues">Issues</mat-radio-button>
        <mat-radio-button value="board">Board</mat-radio-button>
      </mat-radio-group>
    </div>

    <mat-form-field appearance="outline" class="capacity">
      <mat-label>Daily capacity</mat-label>
      <input matInput type="number" formControlName="dailyCapacity" min="1" max="12" />
      <span matSuffix>h</span>
      <mat-hint>Hours a day you can spend on issues</mat-hint>
      <mat-error>Between 1 and 12 hours</mat-error>
    </mat-form-field>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.pristine">Save</button>
    </div>
  </form>
</section>
