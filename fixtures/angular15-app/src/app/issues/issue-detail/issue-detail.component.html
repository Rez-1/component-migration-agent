<section class="page" *ngIf="issue$ | async as issue; else missing">
  <button mat-button type="button" class="back" (click)="back()">
    <mat-icon>arrow_back</mat-icon>
    All issues
  </button>

  <mat-card class="issue">
    <mat-card-header>
      <mat-card-title>#{{ issue.id }} {{ issue.title }}</mat-card-title>
      <mat-card-subtitle>
        {{ issue.type | titlecase }} · {{ statusLabels[issue.status] }} · P{{ issue.priority }} ·
        {{ issue.assignee ?? 'Unassigned' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-chip-list class="current-labels" aria-label="Labels" [selectable]="false">
        <mat-chip *ngFor="let label of issue.labels" color="primary" selected>{{ label }}</mat-chip>
      </mat-chip-list>

      <p class="description">{{ issue.description }}</p>

      <app-label-editor
        [labels]="issue.labels"
        (labelsChange)="setLabels(issue, $event)"
      ></app-label-editor>

      <h3 class="mat-subheading-2">Comments</h3>
      <mat-list class="comments">
        <mat-list-item *ngFor="let comment of issue.comments" class="comment">
          <strong>{{ comment.author }}</strong>&nbsp;({{ comment.posted }}): {{ comment.text }}
        </mat-list-item>
      </mat-list>
    </mat-card-content>

    <mat-card-actions align="end" *ngIf="issue.status !== 'closed'">
      <app-confirm-button
        label="Close issue"
        confirmLabel="Close it for good?"
        icon="check_circle"
        color="primary"
        (confirmed)="close(issue)"
      ></app-confirm-button>
    </mat-card-actions>
  </mat-card>
</section>

<ng-template #missing>
  <section class="page">
    <p>That issue doesn't exist.</p>
  </section>
</ng-template>
